site_name: roy7w · AI Agent 学习博客
site_description: 以 UR7e 具身 Agent 为长期主项目的 Stage 0–9 求职与工程学习路线
site_author: roy wang
site_url: https://roy7w.github.io/
repo_url: https://github.com/roy7w/roy7w.github.io
repo_name: roy7w/roy7w.github.io
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

nav:
  - 首页: index.md
  - AI Agent 学习路线:
      - 路线总览: ai-agent/index.md
      - "Stage 0 · LLM & Agent 全局认知": ai-agent/stage-00.md
      - "Stage 1 · Minimal Agent + Robot Mock": ai-agent/stage-01.md
      - "Stage 2 · ROS2 / MoveIt2 / UR7e 控制基础": ai-agent/stage-02.md
      - "Stage 3 · Robot Tools + RAG + Memory": ai-agent/stage-03.md
      - "Stage 4 · LangGraph + Backend + 受约束具身 Agent": ai-agent/stage-04.md
      - "Stage 5 · Skills + MCP + UR7e Agent": ai-agent/stage-05.md
      - "Stage 6 · Eval + Safety + Observability": ai-agent/stage-06.md
      - "Stage 7 · VLA / 模仿学习 / Post-training（Advanced / Optional）": ai-agent/stage-07.md
      - "Stage 8 · Inference / AI Infra / Edge Deployment": ai-agent/stage-08.md
      - "Stage 9 · Production / Portfolio / 求职": ai-agent/stage-09.md
      - "Later / Optional": ai-agent/later.md
  - Agent 项目实践: projects/index.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang:
        - zh
        - en

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/roy7w

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/progress-data.js
  - assets/javascripts/progress.js

copyright: Copyright &copy; 2026 roy wang

not_in_nav: |
  /ai-agent/archive/**
  /ai-agent/stage-10.md
